[package]
name = "ideultra"
version = "0.16.0"
edition = "2021"
rust-version = "1.78"
authors = ["MPJHorner <matt@heyjodie.com>"]
description = "A snappy, native, local-first code IDE. Part of the Ultra family."
license = "MIT"
repository = "https://github.com/MPJHorner/IdeUltra"
homepage = "https://mpjhorner.github.io/IdeUltra/"
readme = "README.md"

[dependencies]
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.28"
egui_extras = { version = "0.28", features = ["all_loaders"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
anyhow = "1"
rfd = "0.14"
ignore = "0.4"
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }
once_cell = "1"
regex = "1"
notify = { version = "6", default-features = false, features = ["macos_fsevent"] }
crossbeam-channel = "0.5"
pulldown-cmark = { version = "0.10", default-features = false }
similar = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[package.metadata.bundle]
name = "IdeUltra"
identifier = "com.mpjhorner.ideultra"
category = "public.app-category.developer-tools"
short_description = "A snappy, native, local-first code IDE."
long_description = "IdeUltra is a fast, native code editor focused on speed and simplicity. Part of the Ultra family of local-first developer tools."
